<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Audio Call (WebRTC, Pure JS)</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 100px; }
    button { margin: 6px 0; }
    audio { display: block; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Simple Audio Call - No Backend</h2>

  <button id="startBtn">Start Local Mic</button>
  <button id="createOfferBtn">Create Offer</button>
  <button id="createAnswerBtn">Create Answer</button>
  <button id="setAnswerBtn">Set Remote Answer</button>

  <h3>Offer (copy & send to friend):</h3>
  <textarea id="offer"></textarea>

  <h3>Answer (paste from friend):</h3>
  <textarea id="answer"></textarea>

  <audio id="remoteAudio" controls autoplay></audio>

  <script>
    let pc;
    let localStream;

    async function init() {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      alert("Microphone ready!");
    }

    document.getElementById('startBtn').onclick = init;

    function waitForIceGatheringComplete(pc) {
      return new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') return resolve();
        function check() {
          if (pc.iceGatheringState === 'complete') {
            pc.removeEventListener('icegatheringstatechange', check);
            resolve();
          }
        }
        pc.addEventListener('icegatheringstatechange', check);
      });
    }

    document.getElementById('createOfferBtn').onclick = async () => {
      if (!localStream) { alert('Click "Start Local Mic" first'); return; }
      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] // add TURN for production
      });
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.ontrack = (event) => {
        document.getElementById('remoteAudio').srcObject = event.streams[0];
      };
      pc.onicecandidate = () => { /* optional: can log candidates here */ };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      // wait for ICE gathering to finish so SDP contains candidates
      await waitForIceGatheringComplete(pc);
      document.getElementById('offer').value = JSON.stringify(pc.localDescription);
    };

    document.getElementById('createAnswerBtn').onclick = async () => {
      if (!localStream) { alert('Click "Start Local Mic" first'); return; }
      pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
      });
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
      pc.ontrack = (event) => {
        document.getElementById('remoteAudio').srcObject = event.streams[0];
      };

      let offerObj;
      try {
        offerObj = JSON.parse(document.getElementById('offer').value);
      } catch (e) {
        alert('Invalid offer JSON');
        return;
      }

      await pc.setRemoteDescription(offerObj);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      await waitForIceGatheringComplete(pc);
      document.getElementById('answer').value = JSON.stringify(pc.localDescription);
    };

    document.getElementById('setAnswerBtn').onclick = async () => {
      if (!pc) { alert('No RTCPeerConnection exists. Create offer/answer first.'); return; }
      let answerObj;
      try {
        answerObj = JSON.parse(document.getElementById('answer').value);
      } catch (e) {
        alert('Invalid answer JSON');
        return;
      }
      await pc.setRemoteDescription(answerObj);
      alert("Connected! You should hear audio now (if NAT/ICE allows).");
    };
  </script>
</body>
</html>
